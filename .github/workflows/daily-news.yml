name: 每日新闻自动生成

on:
  # ⚠️ 定时触发已手动关闭，仅保留手动触发
  # schedule:
  #   - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

# 赋予写入仓库权限（用于自动 push）
permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整历史，方便后续 push

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行新闻生成脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}
        run: python scripts/generate_news_server.py

      - name: 运行 gen-index.py 更新索引
        run: python scripts/gen-index.py

      - name: 提交并推送更新
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/ news-index.json sw.js || true
          git diff --quiet && echo "没有变更，跳过提交" || {
            git commit -m "auto: 每日新闻自动更新 $(date +%Y-%m-%d)"
            git push
          }
