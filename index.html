<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>早间新闻</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preload" href="news-index.json" as="fetch" crossorigin="anonymous">
    <link rel="prefetch" href="news-index.json">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="菜单">
            <span></span><span></span><span></span>
        </button>
        <h1 class="logo">📰 早间新闻</h1>
        <div class="topbar-right">
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换白天/夜间模式">🌙</button>
            <span class="today-badge" id="todayBadge"></span>
        </div>
    </header>

    <div class="app-container">
        <!-- 侧边栏：日期列表 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>📅 历史日期</h2>
                <button class="sidebar-close" id="sidebarClose">&times;</button>
            </div>
            <div class="sidebar-search">
                <input type="text" id="dateSearch" placeholder="搜索日期 (YYYY-MM-DD)..." />
            </div>
            <nav class="date-list" id="dateList">
                <!-- 由 JS 动态渲染 -->
            </nav>
        </aside>

        <!-- 主内容 -->
        <main class="main-content" id="mainContent">
            <!-- 首页欢迎 -->
            <section class="welcome" id="welcome">
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-icon">📰</div>
                    <h2>早间新闻浏览器</h2>
                    <p>从左侧选择日期浏览每日早间新闻</p>
                    <div class="welcome-stats" id="welcomeStats">
                        <div class="loading" style="display:flex;padding:10px 0;">
                            <div class="spinner"></div>
                            <p style="margin-left:8px;">加载索引中...</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 日期视图 -->
            <section class="date-view" id="dateView" style="display:none;">
                <!-- 日期标题 -->
                <div class="date-header">
                    <h2 id="dateTitle"></h2>
                    <div class="date-nav">
                        <button id="prevDay" title="前一天">‹</button>
                        <button id="nextDay" title="后一天">›</button>
                    </div>
                </div>

                <!-- 分类标签（新格式） -->
                <div class="category-tabs" id="categoryTabs" style="display:none;"></div>

                <!-- 新闻内容 -->
                <div class="news-content" id="newsContent">
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 移动端遮罩 -->
    <div class="overlay" id="overlay"></div>

    <script src="js/app.js"></script>
</body>
</html>
