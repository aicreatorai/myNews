<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>早间新闻</title>
    <script>
        // ★ 主题初始化：必须在页面渲染前执行，防止白→暗闪烁
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
        // ★ 子路径适配：自动检测部署路径（GitHub Pages子目录等）
        (function() {
            var path = window.location.pathname;
            var base = path.substring(0, path.lastIndexOf('/') + 1);
            var baseTag = document.createElement('base');
            baseTag.href = base;
            document.head.appendChild(baseTag);
        })();
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="css/main.css?v=m12">
    <link rel="preload" href="news-index.json?v=m11" as="fetch" crossorigin="anonymous">
    <link rel="prefetch" href="news-index.json?v=m11">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="菜单">
            <span></span><span></span><span></span>
        </button>
        <h1 class="logo">📰 早间新闻</h1>
        <div class="topbar-right">
            <button class="stealth-btn" id="stealthToggle" title="隐身模式（隐藏侧栏+顶栏）">🙈</button>
            <a href="englishStudy/index.html" class="english-btn" title="英语学习">EN</a>
            <button class="refresh-btn" id="refreshBtn" aria-label="刷新" title="刷新数据">🔄</button>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换白天/夜间模式">🌙</button>
            <span class="today-badge" id="todayBadge"></span>
        </div>
    </header>

    <!-- 移动端日期条 -->
    <div class="mobile-date-strip" id="mobileDateStrip">
        <div class="mobile-date-track" id="mobileDateTrack"></div>
    </div>

    <!-- 移动端分类条 -->
    <div class="mobile-category-strip" id="mobileCategoryStrip">
        <div class="mobile-category-track" id="mobileCategoryTrack"></div>
    </div>

    <div class="app-container">
        <!-- 侧边栏：日期列表 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>📅 历史日期</h2>
                <button class="sidebar-close" id="sidebarClose">&times;</button>
            </div>
            <div class="sidebar-search">
                <input type="text" id="dateSearch" placeholder="搜索日期 (YYYY-MM-DD)..." />
            </div>
            <nav class="date-list" id="dateList">
                <!-- 由 JS 动态渲染 -->
            </nav>
        </aside>

        <!-- 主内容 -->
        <main class="main-content" id="mainContent">
            <!-- 首页欢迎 -->
            <section class="welcome" id="welcome">
                <div class="welcome-card" id="welcomeCard">
                    <div class="welcome-icon">📰</div>
                    <h2>早间新闻浏览器</h2>
                    <p>从左侧选择日期浏览每日早间新闻</p>
                    <div class="welcome-stats" id="welcomeStats">
                        <div class="loading" style="display:flex;padding:10px 0;">
                            <div class="spinner"></div>
                            <p style="margin-left:8px;">加载索引中...</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 日期视图 -->
            <section class="date-view" id="dateView" style="display:none;">
                <!-- 日期标题 -->
                <div class="date-header">
                    <h2 id="dateTitle"></h2>
                    <div class="date-nav">
                        <button id="prevDay" title="前一天">‹</button>
                        <button id="nextDay" title="后一天">›</button>
                    </div>
                </div>

                <!-- 分类标签（新格式） -->
                <div class="category-tabs" id="categoryTabs" style="display:none;"></div>

                <!-- 新闻内容 -->
                <div class="news-content" id="newsContent">
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 移动端遮罩 -->
    <div class="overlay" id="overlay"></div>

    <script src="js/app.js?v=m11"></script>
</body>
</html>
